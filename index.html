<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake Game</title>
  <style>
    :root{--bg:#07151a;--bg-2:#0d232d;--panel:rgba(14,28,36,0.95);--panel-2:rgba(17,39,49,0.96);--text:#edf7ff;--muted:#b9d7e6;--shadow:rgba(0,0,0,0.28)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:radial-gradient(circle at top,var(--bg-2),var(--bg) 46%,#040c0f 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{display:flex;flex-direction:column;align-items:center;padding:18px;min-height:100vh}

    /* Topbar */
    .topbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 36px));display:flex;gap:12px;align-items:center;justify-content:flex-start;padding:8px;border-radius:12px;background:linear-gradient(180deg,#102027, #0b1b22);border:1px solid rgba(125,211,252,0.08);z-index:60}
    details.top-dropdown{background:transparent;border-radius:10px;padding:4px 8px;color:var(--text)}
    details.top-dropdown summary{cursor:pointer;font-weight:700}
    .panel-content{display:none;margin-top:8px;max-height:320px;overflow:auto;background:rgba(8,18,24,0.7);padding:8px;border-radius:8px}
    details.top-dropdown[open] > .panel-content{display:block}

    .app{width:min(1120px,100%);margin-top:82px;display:flex;gap:18px;align-items:flex-start;justify-content:center}

    .game-column{display:flex;flex-direction:column;gap:12px;align-items:center;width:100%;max-width:460px}
    .hud{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:12px;background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid rgba(138,196,255,0.08)}
    .hud .controls{display:flex;gap:8px;align-items:center}

    .game-wrap{width:100%;max-width:420px;border-radius:14px;overflow:visible;background:linear-gradient(180deg,#021b1c,#0a2d2d);border:1px solid rgba(138,196,255,0.08);box-shadow:0 18px 34px rgba(0,0,0,0.28)}
    canvas{display:block;width:100%;height:auto;background:linear-gradient(180deg,rgba(4,24,28,0.98),rgba(3,27,33,0.96));image-rendering:pixelated;border-radius:14px}

    .overlay{position:fixed;inset:0;background:rgba(2,8,11,0.75);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:70}
    .overlay.hidden{display:none}
    #pauseOverlay,#deathOverlay{position:absolute;inset:0;background:rgba(2,8,11,0.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}

    .mobile-controls{display:none;width:100%;max-width:420px;margin-top:6px;gap:8px;flex-direction:column;align-items:center}
    .mobile-pad{display:grid;grid-template-columns:repeat(3,minmax(52px,74px));gap:8px;justify-content:center}
    .mobile-btn{min-width:52px;min-height:52px;border-radius:14px;font-size:22px;font-weight:700}

    @media (max-width:760px){body{padding:10px}.topbar{left:8px;transform:none;width:calc(100% - 16px);top:8px}.app{margin-top:78px}.mobile-controls{display:flex}}
  </style>
</head>
<body>
  <div class="topbar">
    <details class="top-dropdown" id="accountsDropdown">
      <summary>Accounts</summary>
      <div class="panel-content">
        <select id="accountSelect" style="width:100%;margin-bottom:8px"></select>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button id="switchAccountBtn">Switch</button>
          <button id="addAccountBtn">Add</button>
          <button id="renameAccountBtn">Rename</button>
          <button id="removeAccountBtn">Remove</button>
        </div>
        <div style="font-weight:700;margin-top:8px">Current account</div>
        <div id="currentAccountLabel">Guest</div>
      </div>
    </details>

    <details class="top-dropdown" id="keybindsDropdown">
      <summary>Keybinds</summary>
      <div class="panel-content">
        <select id="keybindProfileSelect">
          <option value="default">Default</option>
          <option value="profile1">Profile 1</option>
          <option value="profile2">Profile 2</option>
        </select>
        <div id="keybindList" style="display:grid;gap:8px;margin-top:8px"></div>
      </div>
    </details>

    <details class="top-dropdown" id="leaderboardsDropdown">
      <summary>Leaderboards</summary>
      <div class="panel-content">
        <select id="leaderboardSelect">
          <option value="overall">Overall</option>
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
          <option value="extreme">Extreme</option>
          <option value="drunk">Drunk</option>
        </select>
        <ul id="scoreboardList" style="margin-top:8px"></ul>
      </div>
    </details>
  </div>

  <div class="app">
    <main class="game-column">
      <div class="hud">
        <div id="score">Score: 0</div>
        <div style="display:flex;gap:8px;align-items:center">
          <label style="display:flex;align-items:center;gap:6px;color:#ddd">Difficulty:
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
              <option value="extreme">Extreme</option>
              <option value="drunk">Drunk</option>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:6px;color:#ddd"><input id="autoReplayToggle" type="checkbox">Auto replay</label>
        </div>
        <div class="controls">
          <button id="restartBtn">Restart</button>
          <button id="quitBtn">Quit</button>
        </div>
      </div>

      <div class="game-wrap">
        <canvas id="game" width="400" height="400"></canvas>

        <div id="pauseOverlay" class="overlay hidden">
          <h2 style="margin:0">Paused</h2>
          <div id="pauseScore" style="color:#ddd">Score: 0</div>
          <label style="display:flex;align-items:center;gap:6px;color:#ddd">Difficulty:
            <select id="pauseDifficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="extreme">Extreme</option><option value="drunk">Drunk</option></select>
          </label>
          <label style="display:flex;align-items:center;gap:6px;color:#ddd"><input id="pauseAutoReplay" type="checkbox">Auto replay</label>
          <div style="display:flex;gap:8px"><button id="pauseRestartBtn">Restart</button><button id="resumeBtn">Resume</button></div>
        </div>

        <div id="deathOverlay" class="overlay hidden">
          <h2 style="margin:0">You Died</h2>
          <div id="deathScore" style="color:#ddd">Score: 0</div>
          <label style="display:flex;align-items:center;gap:6px;color:#ddd">Difficulty:
            <select id="deathDifficulty"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option><option value="extreme">Extreme</option><option value="drunk">Drunk</option></select>
          </label>
          <label style="display:flex;align-items:center;gap:6px;color:#ddd"><input id="deathAutoReplay" type="checkbox">Auto replay</label>
          <div style="display:flex;gap:8px"><button id="deathRestartBtn">Restart</button><button id="deathQuitBtn">Quit</button></div>
        </div>
      </div>

      <div id="mobileControls" class="mobile-controls" aria-label="Touch controls">
        <div class="mobile-pad">
          <button class="mobile-btn" data-direction="up" aria-label="Move up">▲</button>
          <button class="mobile-btn" data-direction="left" aria-label="Move left">◀</button>
          <button class="mobile-btn" data-direction="right" aria-label="Move right">▶</button>
          <button class="mobile-btn" data-direction="down" aria-label="Move down">▼</button>
        </div>
        <div class="mobile-actions"><button class="mobile-btn" data-action="pause">Pause</button><button class="mobile-btn" data-action="restart">Restart</button></div>
      </div>

      <div class="small-text">Move with Arrow Keys or WASD. Press P to pause, R to restart.</div>
    </main>
  </div>

  <div id="startScreen" class="overlay">
    <h1 style="margin:0;font-size:clamp(2.1rem,5vw,3.25rem)">Snake</h1>
    <div style="color:#ddd;text-align:center;max-width:320px">Press Start or Arrow/WASD keys to begin</div>
    <div style="display:flex;gap:8px;margin-top:8px"><button id="startBtn">Start</button><button id="closeStartBtn">Close</button></div>
  </div>

  <div style="text-align:center;margin-top:12px;color:var(--muted)">Ahmed and Bonnie Corp</div>
  <script src="test.js"></script>
</body>
</html>
