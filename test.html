<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Snake Game</title>
  <style>
    :root {
      --bg: #07151a;
      --bg-2: #0d232d;
      --panel: rgba(14, 28, 36, 0.95);
      --panel-2: rgba(17, 39, 49, 0.96);
      --panel-3: rgba(21, 52, 65, 0.95);
      --text: #edf7ff;
      --muted: #b9d7e6;
      --green: #6ee7a7;
      --green-2: #34d399;
      --green-dark: #0d5f3f;
      --red: #ff5d73;
      --gold: #ffd166;
      --blue: #7dd3fc;
      --purple: #b98cff;
      --shadow: rgba(0, 0, 0, 0.28);
      --grid: rgba(125, 211, 252, 0.18);
      --danger: #ff4d6d;
      --success: #2dd4bf;
      --warning: #fbbf24;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, var(--bg-2), var(--bg) 46%, #040c0f 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      min-height: 100vh;
    }

    .app {
      width: min(1120px, 100%);
      display: grid;
      gap: 18px;
      grid-template-columns: 330px minmax(320px, 1fr);
      align-items: start;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(138, 196, 255, 0.18);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 16px 32px var(--shadow);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .account-row, .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    select, button, input {
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.2);
      background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      transition: transform 0.15s ease, filter 0.15s ease, border-color 0.15s ease;
    }

    button {
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 6px 16px rgba(0,0,0,0.15);
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    select {
      width: 100%;
    }

    #scoreboardList {
      list-style: none;
      padding: 0;
      margin: 12px 0 0;
      display: grid;
      gap: 8px;
    }

    #scoreboardList li {
      background: rgba(12, 24, 32, 0.8);
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid rgba(125, 211, 252, 0.12);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
    }

    .game-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: linear-gradient(180deg, var(--panel), var(--panel-2));
      border: 1px solid rgba(138, 196, 255, 0.18);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 16px 32px var(--shadow);
    }

    .hud > * {
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    .game-wrap {
      position: relative;
      width: min(100%, 420px);
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.28);
      background: linear-gradient(180deg, #021b1c, #0a2d2d);
      border: 1px solid rgba(138, 196, 255, 0.2);
    }

    canvas {
      display: block;
      width: min(100%, 420px);
      height: auto;
      background: linear-gradient(180deg, rgba(4, 24, 28, 0.98), rgba(3, 27, 33, 0.96));
      border-radius: 16px;
      image-rendering: pixelated;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 11, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
    }

    .overlay.hidden { display: none; }

    #pauseOverlay, #deathOverlay {
      position: absolute;
      inset: 0;
      background: rgba(2, 8, 11, 0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 30;
    }

    #pauseScore, #deathScore {
      color: var(--text);
      font-size: 1.1rem;
      font-weight: 700;
    }

    .small-text {
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    .mobile-controls {
      display: none;
      width: min(100%, 420px);
      margin-top: 6px;
      gap: 8px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .mobile-controls.visible {
      display: flex;
    }

    .mobile-pad {
      display: grid;
      grid-template-columns: repeat(3, minmax(52px, 74px));
      gap: 8px;
      justify-content: center;
    }

    .mobile-btn {
      min-width: 52px;
      min-height: 52px;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(180deg, var(--panel-3), var(--panel-2));
      border: 1px solid rgba(125, 211, 252, 0.18);
    }

    .mobile-btn[data-direction="left"] { grid-column: 1; }
    .mobile-btn[data-direction="up"] { grid-column: 2; }
    .mobile-btn[data-direction="down"] { grid-column: 2; }
    .mobile-btn[data-direction="right"] { grid-column: 3; }

    .mobile-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mobile-actions .mobile-btn {
      min-width: 110px;
      min-height: 44px;
      font-size: 14px;
      font-weight: 700;
    }

    .panel-title {
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.02em;
    }

    @media (max-width: 760px) {
      body {
        padding: 10px;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .hud {
        padding: 8px 10px;
        font-size: 0.92rem;
      }

      .panel {
        padding: 12px;
      }

      .game-wrap, canvas, .mobile-controls {
        width: min(100vw - 32px, 420px);
      }

      .mobile-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="panel controls">
      <h2 class="panel-title">Accounts</h2>
      <div class="account-row">
        <select id="accountSelect" style="flex:1"></select>
      </div>
      <div class="button-row">
        <button id="switchAccountBtn">Switch</button>
        <button id="addAccountBtn">Add</button>
        <button id="renameAccountBtn">Rename</button>
        <button id="removeAccountBtn">Remove</button>
      </div>

      <div class="panel" style="padding: 10px 12px; background: rgba(12, 24, 32, 0.8);">
        <div style="font-weight:bold; margin-bottom:8px;">Current account</div>
        <div id="currentAccountLabel">Guest</div>
      </div>

      <h2 class="panel-title">Keybinds</h2>
      <select id="keybindProfileSelect">
        <option value="default">Default</option>
        <option value="profile1">Profile 1</option>
        <option value="profile2">Profile 2</option>
      </select>
      <div id="keybindList" style="display:grid; gap:8px; margin-top:8px;"></div>

      <h2 class="panel-title">Leaderboards</h2>
      <select id="leaderboardSelect">
        <option value="overall">Overall</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="extreme">Extreme</option>
        <option value="drunk">Drunk</option>
      </select>
      <ul id="scoreboardList"></ul>
    </aside>

    <main class="game-panel">
      <div class="hud">
        <div id="score">Score: 0</div>
        <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
          Difficulty:
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
            <option value="extreme">Extreme</option>
            <option value="drunk">Drunk</option>
          </select>
        </label>
        <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
          <input id="autoReplayToggle" type="checkbox">
          Auto replay
        </label>
        <button id="restartBtn">Restart</button>
      </div>

      <div class="game-wrap">
        <canvas id="game" width="400" height="400"></canvas>

        <div id="pauseOverlay" class="overlay hidden">
          <h2 style="margin:0">Paused</h2>
          <div id="pauseScore" style="color:#ddd;">Score: 0</div>
          <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
            Difficulty:
            <select id="pauseDifficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
              <option value="extreme">Extreme</option>
              <option value="drunk">Drunk</option>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
            <input id="pauseAutoReplay" type="checkbox">
            Auto replay
          </label>
          <div class="button-row">
            <button id="pauseRestartBtn">Restart</button>
            <button id="resumeBtn">Resume</button>
          </div>
        </div>

        <div id="deathOverlay" class="overlay hidden">
          <h2 style="margin:0">You Died</h2>
          <div id="deathScore" style="color:#ddd;">Score: 0</div>
          <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
            Difficulty:
            <select id="deathDifficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
              <option value="extreme">Extreme</option>
              <option value="drunk">Drunk</option>
            </select>
          </label>
          <label style="display:flex;align-items:center;gap:6px; color:#ddd;">
            <input id="deathAutoReplay" type="checkbox">
            Auto replay
          </label>
          <div class="button-row">
            <button id="deathRestartBtn">Restart</button>
          </div>
        </div>
      </div>

      <div id="mobileControls" class="mobile-controls" aria-label="Touch controls">
        <div class="mobile-pad">
          <button class="mobile-btn" data-direction="up" aria-label="Move up">▲</button>
          <button class="mobile-btn" data-direction="left" aria-label="Move left">◀</button>
          <button class="mobile-btn" data-direction="right" aria-label="Move right">▶</button>
          <button class="mobile-btn" data-direction="down" aria-label="Move down">▼</button>
        </div>
        <div class="mobile-actions">
          <button class="mobile-btn" data-action="pause" aria-label="Pause">Pause</button>
          <button class="mobile-btn" data-action="restart" aria-label="Restart">Restart</button>
        </div>
      </div>

      <div class="small-text">Move with Arrow Keys or WASD. Press P to pause, R to restart.</div>
    </main>
  </div>

  <div id="startScreen" class="overlay">
    <h1 style="margin:0; font-size: clamp(2.1rem, 5vw, 3.25rem);">Snake</h1>
    <div style="color:#ddd; text-align:center; max-width: 320px;">Press Start or Arrow/WASD keys to begin</div>
    <button id="startBtn">Start</button>
  </div>

  <script src="test.js"></script>
</body>
</html>
